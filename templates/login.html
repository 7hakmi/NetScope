<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NetScope | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(0, 210, 255, 0.12), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 190, 0.08), transparent 35%),
                #07111f;

            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #ffffff;
        }

        /* Background Grid */
        body::before {
            content: "";
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);

            background-size: 45px 45px;
            pointer-events: none;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #00d4ff,
                    #00bfa6
                );

            display: flex;
            align-items: center;
            justify-content: center;

            color: #04111c;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -1px;

            box-shadow:
                0 0 35px rgba(0, 212, 255, 0.25);
        }

        .brand h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .brand p {
            color: #7f93aa;
            margin-top: 7px;
            font-size: 14px;
        }

        .login-card {
            background: rgba(12, 25, 43, 0.88);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 24px;

            padding: 32px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.35);

            backdrop-filter: blur(20px);
        }

        .login-card h2 {
            font-size: 20px;
            margin-bottom: 6px;
        }

        .login-card .subtitle {
            color: #71869d;
            font-size: 13px;
            margin-bottom: 26px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #9cafc2;
            font-weight: 600;
        }

        .field input {
            width: 100%;
            height: 50px;

            border: 1px solid #20364d;
            border-radius: 12px;

            background: #091727;

            color: white;

            padding: 0 15px;

            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }

        .field input:focus {
            border-color: #00cbe6;

            box-shadow:
                0 0 0 3px rgba(0, 203, 230, 0.08);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .show-password {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);

            border: 0;
            background: transparent;

            color: #00cbe6;

            cursor: pointer;

            font-size: 12px;
            font-weight: 600;
        }

        .login-button {
            width: 100%;
            height: 52px;

            border: 0;
            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #00d4ff,
                    #00bfa6
                );

            color: #04111c;

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;

            margin-top: 8px;

            transition: 0.2s;
        }

        .login-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 10px 30px rgba(0, 212, 255, 0.20);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .error {
            background: rgba(255, 75, 92, 0.10);

            border: 1px solid rgba(255, 75, 92, 0.25);

            color: #ff8792;

            padding: 11px 13px;

            border-radius: 10px;

            margin-bottom: 18px;

            font-size: 13px;
        }

        .secure {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            color: #64788e;

            font-size: 11px;

            margin-top: 22px;
        }

        .secure-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #00d69a;

            box-shadow:
                0 0 10px rgba(0,214,154,0.6);
        }

        .footer {
            text-align: center;

            color: #51667d;

            font-size: 11px;

            margin-top: 22px;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 25px;
            }

            .brand h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="brand">

        <div class="logo">
            NS
        </div>

        <h1>NetScope</h1>

        <p>
            Infrastructure Monitoring Platform
        </p>

    </div>


    <div class="login-card">

        <h2>Welcome back</h2>

        <div class="subtitle">
            Sign in to access your monitoring dashboard.
        </div>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST" action="{{ url_for('login') }}">

            <div class="field">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                    autofocus
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        class="show-password"
                        type="button"
                        onclick="togglePassword()"
                    >
                        Show
                    </button>

                </div>

            </div>


            <button
                class="login-button"
                type="submit"
            >
                Sign in to NetScope
            </button>

        </form>


        <div class="secure">

            <span class="secure-dot"></span>

            Secure NetScope Session

        </div>

    </div>


    <div class="footer">
        NetScope · Network & Infrastructure Monitoring
    </div>

</div>


<script>
    function togglePassword() {

        const passwordInput =
            document.getElementById("password");

        const button =
            document.querySelector(".show-password");


        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            button.textContent = "Hide";

        } else {

            passwordInput.type = "password";

            button.textContent = "Show";
        }
    }
</script>

</body>
</html>
